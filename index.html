<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Solving Mathematical Problems - Terence Tao (E-Book Reader)</title>
    <meta name="description" content="Nền tảng đọc sách học thuật tương tác cuốn 'Solving Mathematical Problems: A Personal Perspective' của Terence Tao với MathJax, tìm kiếm toàn văn, ghi chú, dấu trang và kiểm tra toàn vẹn dữ liệu." />
    <meta property="og:title" content="Solving Mathematical Problems - Terence Tao (E-Book Reader)" />
    <meta property="og:description" content="Nền tảng đọc sách học thuật tương tác cuốn 'Solving Mathematical Problems: A Personal Perspective' của Terence Tao." />
    <meta property="og:type" content="book" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Google Fonts: Academic Serif & Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,600;1,400&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400;1,8..60,600&display=swap" rel="stylesheet">

    <!-- MathJax 3 Configuration -->
    <script>
      window.MathJax = {
        tex: {
          inlineMath: [['\\(', '\\)'], ['$', '$']],
          displayMath: [['\\[', '\\]'], ['$$', '$$']],
          processEscapes: true,
          processEnvironments: true
        },
        options: {
          ignoreHtmlClass: 'tex2jax_ignore',
          processHtmlClass: 'tex2jax_process'
        },
        startup: {
          pageReady: () => {
            return MathJax.startup.defaultPageReady();
          }
        }
      };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <!-- Reader Stylesheet -->
    <link rel="stylesheet" href="/styles.css">
